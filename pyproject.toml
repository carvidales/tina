[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tina-bot"
version = "0.1.0"
description = "Paper-first crypto trading with independent, fail-closed entry controls"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.48.0", "pydantic==2.13.5",
  "httpx==0.28.1", "SQLAlchemy==2.0.50", "psycopg[binary]>=3.2.10,<4"
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pandas>=2.2,<4", "PyYAML>=6,<7"]
research = ["tradingagents @ https://github.com/TauricResearch/TradingAgents/archive/c4544913a14ed3df5f1ed7b9e8483270ce20682a.tar.gz"]
reports = ["quantstats>=0.0.77,<1", "pandas>=2.2,<4"]

[tool.setuptools.packages.find]
include = ["tina*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
