name: TINA checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tina-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tina
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: tina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tina -d tina_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TINA_TEST_DATABASE_URL: postgresql+psycopg://tina:ci-only-disposable@localhost:5432/tina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: python -m compileall -q tina tools user_data/strategies
      - run: python tools/bootstrap.py && docker compose config --quiet
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/bootstrap.py
      - run: docker compose build control
      - run: docker compose --profile research build research
      - run: docker compose --profile reports build reports
      - name: Verify optional integration imports without LLM calls
        run: |
          docker compose --profile research run --rm --no-deps --entrypoint python research -c "from tradingagents.graph.trading_graph import TradingAgentsGraph; from tina.research import run_graph; import inspect; assert 'asset_type' in inspect.signature(TradingAgentsGraph.propagate).parameters"
          docker compose --profile reports run --rm --no-deps --entrypoint python reports -c "import quantstats; import tina.report"
      - name: Load strategy in the pinned engine
        run: docker compose run --rm --no-deps --entrypoint python -v "$PWD/tools/engine_smoke.py:/tmp/engine_smoke.py:ro" freqtrade /tmp/engine_smoke.py
      - name: Boot control plane with PostgreSQL
        run: |
          docker compose up -d --wait postgres control
          python3 tools/control.py status
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove CI resources
        if: always()
        run: docker compose --profile research --profile reports down -v
